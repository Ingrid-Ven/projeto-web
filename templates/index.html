<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      color: #333;
      text-align: center;
    }

    header {
      padding: 40px 20px;
      color: white;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 2.5rem;
    }

    p {
      font-size: 1.2rem;
    }

    nav {
      margin-top: 30px;
    }

    nav a {
      text-decoration: none;
      color: white;
      background-color: rgba(0, 0, 0, 0.2);
      padding: 12px 20px;
      margin: 0 10px;
      border-radius: 8px;
      transition: 0.3s;
      font-weight: bold;
    }

    nav a:hover {
      background-color: rgba(0, 0, 0, 0.4);
      transform: scale(1.05);
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      width: 80%;
      max-width: 600px;
      margin: 50px auto;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    footer {
      margin-top: 40px;
      padding: 20px;
      color: white;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <header>
    <h1>Sistema de Gestão</h1>
  </header>

  <div class="container">
    <p>Bem-vindo ao sistema desenvolvido com Flask.</p>

    <nav>
      <a href="/">Início</a>
      <a href="/sobre">Sobre</a>
      <a href="/cor/red">Página Vermelha</a>
    </nav>
  </div>

  <footer>
    © 2026 - Sistema Web com Flask
  </footer>

</body>
</html>
